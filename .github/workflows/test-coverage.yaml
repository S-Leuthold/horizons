# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Coverage runs after merge, not on pull requests: R-CMD-check already runs
# the suite on every PR, and running it a second time under covr only
# doubled runner time. Coverage always includes the slow tier
# (tests/testthat/helper-tier.R), so tiered tests still count, and the job
# fails unless the test output shows the tier ran.
on:
  push:
    branches: [main, development]
  workflow_dispatch:

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      # covr records coverage in-process, so the suite runs serially here.
      TESTTHAT_PARALLEL: false
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      HORIZONS_SLOW_TESTS: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Check the slow tier ran
        shell: bash
        run: |
          ## --------------------------------------------------------------------
          ## Fails closed, as in R-CMD-check.yaml: the tier counts as run only
          ## if tests/testthat.R reported it on and no test skipped for it.
          mapfile -t routs < <(find '${{ runner.temp }}/package' -name 'testthat.Rout*' -type f)
          if [ "${#routs[@]}" -eq 0 ]; then
            echo "::error::No testthat.Rout under the coverage install, so the slow tier cannot be shown to have run."
            exit 1
          fi
          if ! grep -qx 'horizons slow tier: on' "${routs[@]}"; then
            echo "::error::Coverage should include the slow tier, but the tests ran with it off. Is HORIZONS_SLOW_TESTS set to true?"
            exit 1
          fi
          if grep -q 'slow tier (set HORIZONS_SLOW_TESTS' "${routs[@]}"; then
            echo "::error::Coverage should include the slow tier, but tests skipped for it."
            exit 1
          fi
          echo "The slow tier ran: the tests reported it on, and no test skipped for it."

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package