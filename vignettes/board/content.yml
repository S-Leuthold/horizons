# The pipeline board: hand-authored content.
#
# Everything here is typed by a person and checked by tests/testthat/test-board.R.
# Argument names, defaults and parameter text are NOT in this file: the
# generator (dev/board/build-board.R) takes them from formals() and the Rd, and
# refuses to run if a `default` or `text` field appears on any argument below.
#
# Source pointers: `path#Lnn` for a file and line (line must exist), or
# `path#heading-slug` for a markdown heading (slug must exist). Paths are
# relative to the package root; `../dev/...` reaches the project's dev tree.
#
# Split shares are never typed: write {split_ratio}, {split_train},
# {split_test}, {calib_ratio}, {calib_held} or {fit_rows_share}, and the
# generator fills them from SPLIT_PROP and CALIB_PROP in R/constants.R.
#
# Spec: ../dev/specs/v1-refactor/pipeline-board.md

lanes:
  - id: local
    title: Local
    subtitle: your own referenced samples train the model
    colour: ochre
  - id: library
    title: Library
    subtitle: a reference library is drawn around your batch
    colour: plum

divergences:
  - id: training_set
    after: average
    title: What the model is trained on
    local:
      verb: add_response
      training_set: the user's own samples, with lab values joined by sample id
      targets: unknown until predict(); any later spectra on the same axis
    library:
      verb: select_training
      training_set: the union of each target's k nearest library rows
      targets: the batch, in hand before anything is fitted; its distances to the library are recorded
    differs: >-
      In local mode the training set is whatever the user measured, and the model
      is asked about samples it has never seen. In library mode the samples to be
      predicted are known first, and the training set is built around them from a
      library that ships whole. Everything between here and fit() is the same code
      on both paths; the model never learns which path built its rows.
    source: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up
  - id: prediction
    after: fit
    title: What a prediction can lean on
    local:
      verb: predict
      training_set: the applicability domain is measured against the training set
      targets: new spectra, checked against the training axis by the schema gate
    library:
      verb: predict
      training_set: the applicability signal is the target-to-library distance recorded at selection
      targets: the batch; on-library, a residual correction from the pool fit's out-of-fold errors is worth about 10 %; off-library it hurts, and references (spike) are what help
    differs: >-
      The nearest-library distance recorded by select_training() does two jobs
      after fit(): it is the applicability signal, and it decides whether the
      local residual correction can be trusted. Two batches sit at 1.1 and 3.4
      scaled-score units; where between them the sign flips is unmeasured. The
      correction and its gate are designed, not built.
    source: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up

verbs:

  # ---------------------------------------------------------------------------
  - verb: spectra
    rd: spectra
    label: read spectra into a horizons_data
    lanes: [local, library]
    order: 1
    class_in: "path / data frame"
    class_out: horizons_data
    summary: >-
      The entry point. Reads OPUS files, a CSV, or a data frame already in
      memory, finds the sample-id column and the wavenumber columns, and returns
      a horizons_data whose analysis table has one row per spectrum with the
      wavenumbers as wn_-prefixed predictor columns. Nothing is resampled,
      trimmed or transformed here; the object records where the spectra came
      from and hands the shape question to standardize().
    args:
      - name: source
        touch: Always. A directory of OPUS files, one CSV, or a data frame; never a vector of paths.
        source: R/pipeline-spectra.R#L113
      - name: type
        touch: Only when a directory holds both OPUS and CSV files, or the extension is unusual; otherwise auto-detection reads it from the path.
        source: R/pipeline-spectra.R#L386
      - name: id_col
        touch: When the id column is not one of the recognised aliases (sample_id, id, sample, filename, name and their casings, walked in that priority order). Ignored for OPUS, where the file name is the id.
        source: R/pipeline-spectra.R#L11
      - name: wavelength_cols
        touch: When the spectral columns are neither wn_-prefixed nor purely numeric names, so auto-detection cannot find them.
        source: R/pipeline-spectra.R#L1000
      - name: recursive
        touch: When OPUS files sit in subdirectories of the path given.
        source: R/pipeline-spectra.R#L463
    mechanics:
      - step: Refuses anything that is not a single path or a data frame, then dispatches on which it got.
        source: R/pipeline-spectra.R#L141
      - step: For a path, detects the type from the directory contents or the extension unless `type` says otherwise; OPUS files are anything ending in a dot and digits.
        source: R/pipeline-spectra.R#L900
      - step: OPUS files are read one at a time with opusreader2; a file that fails to read is warned about and skipped, and the run aborts only if none could be read.
        source: R/pipeline-spectra.R#L517
      - step: From each OPUS object it takes the absorbance block (`ab` or `AB`), falling back to the first block that is not metadata, and names the columns by the block's wavenumbers.
        source: R/pipeline-spectra.R#L574
      - step: The file name without its extension becomes both `sample_id` and a `filename` column, kept with role meta for parse_ids() later.
        source: R/pipeline-spectra.R#L641
      - step: For a CSV or a data frame, the id column is found by walking the alias list in priority order, and the wavenumber columns by a wn_ prefix first and purely numeric names second.
        source: R/pipeline-spectra.R#L967
      - step: Every wavenumber column is checked to be numeric and renamed with a wn_ prefix; every other column becomes a meta column.
        source: R/pipeline-spectra.R#L278
      - step: Builds the role map (one id, the predictors, the rest meta) and the object through the class constructor new_horizons_data(), so a raw object carries all nine sections of the contract, with selection NULL until select_training() fills it.
        source: R/class-core.R#L77
      - step: Sorts the predictor columns into decreasing wavenumber order if they arrived otherwise (a library stored increasing, such as the KSSL snapshot), the same way standardize()'s no-op path does, printing a "Sorting" console line when it does, then validates the whole object structurally at stage = "raw" before returning it (#24) — a duplicate or NA sample_id warns rather than aborts here, since replicate scans haven't reached average() yet.
        source: R/pipeline-spectra.R#L175
    records:
      - field: data$analysis, data$role_map
        text: the analysis table and the map from every column to its role; n_rows and the predictor, covariate and response counts are computed from them
        source: R/class-core.R#L115
      - field: provenance$spectra_source, provenance$spectra_type
        text: the path or "tibble", and opus, csv or tibble; created time and the horizons version
        source: R/class-core.R#L128
    refuses:
      - when: source is missing, is not a path or a data frame, or is a vector of paths
        does: aborts
        source: R/pipeline-spectra.R#L105
      - when: the type cannot be detected, or a given type is not opus or csv
        does: aborts and asks for `type`
        source: R/pipeline-spectra.R#L394
      - when: no OPUS files are found, or opusreader2 is not installed, or no file could be read
        does: aborts
        source: R/pipeline-spectra.R#L466
      - when: a single OPUS file fails to read or carries no data block
        does: warns and drops that file
        source: R/pipeline-spectra.R#L523
      - when: no id column matches an alias, or a named id or wavelength column is absent, or a wavelength column is not numeric
        does: aborts, listing the columns it saw
        source: R/pipeline-spectra.R#L979
      - when: a duplicate or NA sample_id — normal before average() collapses replicate scans; Bruker's own OPUS naming collides here ("S100-1.0" and "S100-1.1" both become "S100-1")
        does: warns and continues, class horizons_validation_warning
        source: R/pipeline-spectra.R#L176
      - when: the built object fails validate_horizons_data() on anything else — a role_map that disagrees with the columns, a column with more than one role_map row, zero or more than one id role, an unknown role, more than one outcome, or a stored count that disagrees with the data
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-spectra.R#L176

  # ---------------------------------------------------------------------------
  - verb: standardize
    rd: standardize
    label: one grid, one range
    lanes: [local, library]
    order: 2
    class_in: horizons_data
    class_out: horizons_data
    summary: >-
      Puts the spectra into one shape for modelling: trims to a wavenumber
      range, resamples onto the canonical grid (the multiples of the
      resolution inside the trim bounds, so two sources standardized alike
      share their columns), optionally baseline-corrects on that grid, and
      optionally deletes the water bands. It handles shape, not chemistry: SNV,
      derivatives and smoothing belong to configure() and are applied per
      configuration inside evaluate(), so the same standardized object can be
      modelled under every preprocessing. A second call is a no-op with a
      warning.
    args:
      - name: x
        touch: Always; the object from spectra().
        source: R/pipeline-standardize.R#L618
      - name: resample
        touch: Set it to match the library you will draw from or predict against, since the same resample and trim put both on the same columns; 2 matches OSSL at full resolution, and the experiments run at 4 with no loss for the local model. NULL keeps the data's own axis.
        source: R/pipeline-standardize.R#L870
      - name: trim
        touch: Rarely, but keep it set when sources must share every column; 600 to 4000 is the MIR range the package and the KSSL library share, and with trim NULL each source keeps its own extent. Narrow it only when an instrument's ends are unreliable.
        source: R/pipeline-standardize.R#L838
      - name: remove_water
        touch: Leave FALSE. Deleting columns leaves holes in the axis, a derivative later straddles them, and select_training() refuses a pool with a non-contiguous grid.
        source: R/pipeline-standardize.R#L1060
      - name: baseline
        touch: Only for spectra with a known baseline drift; with resampling it runs on the canonical grid, so every source's hull is pinned at the same bounds.
        source: R/pipeline-standardize.R#L1047
      - name: force
        touch: Never in a pipeline; it re-standardizes an already standardized object and warns that it is doing so.
        source: R/pipeline-standardize.R#L715
    mechanics:
      - step: Validates every argument first and reports all failures together, as a horizons_input_error.
        source: R/pipeline-standardize.R#L614
      - step: If the object already carries a standardization record, returns it unchanged with a warning unless `force = TRUE`.
        source: R/pipeline-standardize.R#L704
      - step: Sorts the predictor columns into decreasing wavenumber order if they arrived otherwise. spectra() already sorts on construction (#24), so this is a no-op for objects built by it and only matters for a hand-built object. This runs on every path; names and values are untouched.
        source: R/pipeline-standardize.R#L730
      - step: If nothing at all is requested, validates the object at stage = "raw" and writes the record so downstream verbs know the step was considered, keeping the grid an earlier call recorded, and the reconciliation select_training() recorded on an object it resampled. Beyond the sort, nothing changes.
        source: R/pipeline-standardize.R#L751
      - step: Otherwise validates the object at stage = "raw" before the rebuild below, so a column present in analysis but missing from role_map is refused rather than silently dropped when Steps 7-9 rebuild the table from role_map's predictor and non-predictor columns (#24).
        source: R/pipeline-standardize.R#L811
      - step: Pulls the predictor columns into a matrix and reads the wavenumbers off the column names.
        source: R/pipeline-standardize.R#L823
      - step: Trims to the requested range by dropping columns outside it. When resampling follows, it keeps the nearest column beyond each bound as well, so a grid point on the bound is interpolated rather than extrapolated; scans starting at 599.74 get a 600 column that way. The count reported is the one inside the bounds.
        source: R/pipeline-standardize.R#L840
      - step: Builds the canonical grid, every multiple of the resolution inside the trim bounds (inside the data's range when trim is NULL), rounded to six decimals. It depends on the arguments alone, so two sources standardized identically over the same trim share their columns; with trim NULL they share them where their ranges overlap.
        source: R/pipeline-standardize.R#L889
      - step: Drops the grid points the data does not reach, with a warning that says how many and at which end; nothing is extrapolated.
        source: R/pipeline-standardize.R#L896
      - step: Drops the grid points that fall in a gap of the input's own axis (a spacing over three times the median and over 30 cm⁻¹, select_training()'s rule), such as a band deleted upstream or by an earlier remove_water, with a warning naming the gaps; nothing is filled.
        source: R/pipeline-standardize.R#L921
      - step: Leaves the values untouched when the axis already is the grid to within 1e-6 cm⁻¹, gaps apart, and says so on the console; otherwise resamples onto the grid by cubic spline through prospectr::resample(), one contiguous run of the data at a time. The points kept beyond the trim bounds go here.
        source: R/pipeline-standardize.R#L962
      - step: Baseline-corrects next, if asked, with a convex hull through prospectr::baseline(), on the canonical grid when resampling (so every source's hull is pinned at the grid's bounds) or on the trimmed native axis when not, and before any water bands are removed, because the hull needs a continuous range.
        source: R/pipeline-standardize.R#L1049
      - step: Deletes the water bands last, if asked, by dropping columns in 1580 to 1720 and 3100 to 3700 cm⁻¹, after resampling so standardize()'s own interpolation never spans them.
        source: R/pipeline-standardize.R#L1062
      - step: Aborts if any value came out non-finite, rebuilds the analysis table and role map with the new wn_ columns, and lets set_analysis() recount the predictors.
        source: R/pipeline-standardize.R#L1079
      - step: Re-validates the whole object at stage = "raw" before returning it — replicate scans haven't reached average() yet, so a duplicate sample_id still only warns here (#24).
        source: R/pipeline-standardize.R#L1150
    records:
      - field: provenance$standardization
        text: the four settings as given, whether the spectra were re-interpolated (resampled) and the grid they sit on (grid, with min, max, step and n; NULL without resampling), the time, and, when any operation actually ran, the final wavelength count and range; the no-op path writes the record without those two
        source: R/pipeline-standardize.R#L1128
      - field: data$analysis, data$role_map
        text: rebuilt with the new predictor columns; every non-predictor column is carried through untouched
        source: R/pipeline-standardize.R#L1102
    refuses:
      - when: an argument is the wrong type or range
        does: aborts with every failure listed, class horizons_input_error
        source: R/pipeline-standardize.R#L681
      - when: the object is already standardized and force is FALSE
        does: warns and returns it unchanged
        source: R/pipeline-standardize.R#L704
      - when: an unregistered analysis column, or any other structural problem, is present before the rebuild (the non-no-op path validates at entry as well as on return, #24)
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-standardize.R#L811
      - when: a duplicate or NA sample_id — normal before average() collapses replicate scans, and standardize() validates at stage = "raw" on every path, the no-op one included, for exactly this reason (#24)
        does: warns and continues, class horizons_validation_warning
        source: R/pipeline-standardize.R#L1150
      - when: the object fails validate_horizons_data() on anything else — a role_map that disagrees with the columns, a column with more than one role_map row, zero or more than one id role, an unknown role, more than one outcome, or a stored count that disagrees with the data
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-standardize.R#L1150
      - when: the trim range does not overlap the data, or water-band removal would delete every column, or fewer than two wavelengths remain to resample
        does: aborts
        source: R/pipeline-standardize.R#L231
      - when: the data does not reach part of the grid
        does: drops those grid points and warns, class horizons_standardize_warning
        source: R/pipeline-standardize.R#L910
      - when: the input's axis has a gap, a band already deleted
        does: drops the grid points inside it and warns, class horizons_standardize_warning
        source: R/pipeline-standardize.R#L936
      - when: no grid point falls inside the data
        does: aborts, class horizons_input_error
        source: R/pipeline-standardize.R#L947
      - when: baseline correction fails, which happens on constant spectra
        does: aborts with the original error
        source: R/pipeline-standardize.R#L378
      - when: any value is non-finite after the operations
        does: aborts with the count
        source: R/pipeline-standardize.R#L1079
    evidence:
      - claim: 4 cm⁻¹ loses nothing against 2 cm⁻¹ for the local model
        where: dev/experiments/2026-09-factorial/README.md#pivot-learner-held-to-pls-on-both-sides
        value: "clay 4.63 against experiment 1's 4.70 RPD at 4 cm⁻¹"

  # ---------------------------------------------------------------------------
  - verb: add_response
    rd: add_response
    label: join lab values by sample id
    lanes: [local]
    order: 3
    class_in: horizons_data
    class_out: horizons_data
    summary: >-
      Joins lab-measured values onto the spectra by sample id. This is the local
      path's answer to "what is the model trained on": the user's own samples,
      each with its measured property. Every joined column gets role response;
      configure() later promotes one of them to the outcome. Exact matching
      only, one join key, and it aborts on duplicate ids in either table because
      a duplicate would multiply or misassign rows. Unmatched samples stay in
      the table with NA. The same call builds a lab's own archive into a library
      for select_training().
    args:
      - name: x
        touch: Always; unique sample ids are required, so average() replicate scans first.
        source: R/pipeline-add-response.R#L341
      - name: source
        touch: Always. A data frame is the canonical form; a CSV path is a convenience that reads it with readr.
        source: R/pipeline-add-response.R#L153
      - name: variable
        touch: Always; the numeric columns to bring across. Nothing else from the source is joined.
        source: R/pipeline-add-response.R#L365
      - name: by
        touch: When the id column has a different name on the lab side; a named pair, horizons name equals source name. One column only.
        source: R/pipeline-add-response.R#L259
    mechanics:
      - step: Validates in order, aborting on the first failure with a tree-nested message; a CSV path is read at this point.
        source: R/pipeline-add-response.R#L114
      - step: Refuses a duplicate join key on either side. On the horizons side the message suggests average(), since duplicates usually mean replicate scans.
        source: R/pipeline-add-response.R#L322
      - step: Keeps only the join key and the named variables from the source.
        source: R/pipeline-add-response.R#L365
      - step: Counts how many horizons ids appear in the source. Zero matches aborts, and the message tests for a case or whitespace mismatch and says so. Under 50 % warns the same way.
        source: R/pipeline-add-response.R#L372
      - step: Left-joins with dplyr, so every spectrum is kept and unmatched ones get NA in the new columns.
        source: R/pipeline-add-response.R#L473
      - step: Counts each variable's non-missing values after the join and prints them under the join count, because a matched id can still carry NA. Rows with NA are kept, since another response on the object may be measured on them; evaluate() and fit() drop the rows whose outcome is NA.
        source: R/pipeline-add-response.R#L487
      - step: Appends the variables to the role map as response and recounts n_responses; the outcome role is not assigned here.
        source: R/pipeline-add-response.R#L498
      - step: Appends a provenance entry, one per call, so several sources can be joined across calls.
        source: R/pipeline-add-response.R#L503
      - step: Re-validates the whole object structurally before returning it (#24).
        source: R/pipeline-add-response.R#L527
    records:
      - field: data$analysis
        text: the response columns, NA where a sample had no match
        source: R/pipeline-add-response.R#L473
      - field: data$role_map, data$n_responses
        text: one response role per variable
        source: R/pipeline-add-response.R#L498
      - field: provenance$add_response
        text: a list of entries, each with the source label, the variables, the join key, the matched and unmatched counts, the non-missing count per variable, and the time
        source: R/pipeline-add-response.R#L503
    refuses:
      - when: x is not a horizons_data, or source is neither a data frame nor an existing file
        does: aborts
        source: R/pipeline-add-response.R#L136
      - when: variable is empty, repeats a name, names a column the source lacks, names a non-numeric column, or names a column the object already has
        does: aborts, listing what it found
        source: R/pipeline-add-response.R#L189
      - when: by names more than one column, is partially named, or names a column missing on either side
        does: aborts
        source: R/pipeline-add-response.R#L259
      - when: the join key has duplicates in the source or in the object
        does: aborts, counting each duplicate
        source: R/pipeline-add-response.R#L322
      - when: no sample matches
        does: aborts with a case and whitespace diagnosis
        source: R/pipeline-add-response.R#L381
      - when: fewer than half match, or any sample is left unmatched
        does: warns, and the unmatched rows carry NA
        source: R/pipeline-add-response.R#L431
      - when: the object fails validate_horizons_data() after the join
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-add-response.R#L527

  # ---------------------------------------------------------------------------
  - verb: select_training
    rd: select_training
    label: draw a training set around the batch
    lanes: [library]
    order: 3
    class_in: targets + library
    class_out: horizons_data
    summary: >-
      The library path's answer to "what is the model trained on". Takes the
      batch of spectra to be predicted and a reference library with measured
      properties, brings the library onto the batch's wavenumber grid, builds a
      similarity space on the library, and draws each target's k nearest library
      rows per property. The union is returned as an ordinary horizons_data, so
      everything downstream runs unchanged, and the record on the object holds
      every neighbourhood, every target's distance to the library, and every
      twin it excluded. The only verb where library and unknowns meet before
      anything is fitted.
    args:
      - name: x
        touch: Always; the batch, standardized. Its grid is the reference the library is resampled onto.
        source: R/pipeline-select-training.R#L257
      - name: pool
        touch: Always; a plain horizons_data with response columns, as it comes from standardize() and add_response(). The verb refuses one that has been validated, evaluated or fitted, or that is itself a prior selection; a merely configured pool is not caught, and its grid and outcome role ride along. To become the one routing argument, library, taking a registered name, a path, or an object.
        source: R/pipeline-select-training.R#L947
      - name: k
        touch: The main lever. 100 is what every recent experiment ran; larger hurts on-library and the evidence off-library is mixed. A named vector sets it per property.
        source: R/pipeline-select-training.R#L288
      - name: scope
        touch: Leave "batch" for one model on the union. "cluster" and "sample" return the same union but record groups for a caller's loop; "global" is the no-selection control.
        source: R/pipeline-select-training.R#L663
      - name: properties
        touch: Name the properties you will model; every library response is drawn for by default, and each draw keeps k measured rows per target.
        source: R/pipeline-select-training.R#L335
      - name: snv
        touch: Rarely; SNV in the similarity space only, never in the model.
        source: R/pipeline-select-training.R#L491
      - name: derivative
        touch: Rarely; 0 turns the Savitzky-Golay filter off in the similarity space.
        source: R/pipeline-select-training.R#L491
      - name: window
        touch: Rarely. The window is in grid points, so its physical width depends on the batch's resolution; the width in cm⁻¹ is recorded and printed.
        source: R/pipeline-select-training.R#L521
      - name: poly
        touch: Rarely; must be at least the derivative order and smaller than the window.
        source: R/select-space.R#L101
      - name: mask
        touch: To drop the water bands from the similarity space; applied inside that space after the derivative, which is why water bands belong here and never in a remove_water = TRUE column deletion upstream. The experiments masked 1580 to 1720 and 3100 to 3700.
        source: R/select-space.R#L130
      - name: space
        touch: '"pls" for a response-driven space against one property; it selects rows using their own measured values, so pool-internal CV becomes optimistic and the verb says so.'
        source: R/pipeline-select-training.R#L531
      - name: ncomp
        touch: Rarely; a proportion of variance for PCA (capped at 100 components) or an integer count, which PLS requires.
        source: R/select-space.R#L269
      - name: sdev_floor
        touch: Rarely. Components below this fraction of PC1's standard deviation leave the distance; 0.10 keeps 13 of 33 components on KSSL and is what makes Mahalanobis stable. 0 disables it.
        source: R/select-space.R#L349
      - name: metric
        touch: The default is due to change. Mahalanobis wins nowhere; cosine is worth 11 % on-library and Euclidean 7 % off-library, and both weight components by variance where Mahalanobis equalizes them.
        source: R/select-neighbours.R#L69
      - name: space_rows
        touch: Leave "all". Under Euclidean the two choices rank neighbours almost identically; the difference that appeared under Mahalanobis was the whitening, not the population.
        source: R/pipeline-select-training.R#L503
      - name: clusters
        touch: scope = "cluster" only; NULL picks the count by silhouette over 2 to 10.
        source: R/select-neighbours.R#L697
      - name: cluster_min
        touch: scope = "cluster" only; clusters under this size are merged into the nearest, and a batch that cannot form two falls back to one group.
        source: R/select-neighbours.R#L770
      - name: twin_ratio
        touch: Leave it until it is calibrated on the KSSL replicate scans; 0.05 was carried over from an earlier rule with a different reference distance.
        source: R/constants.R#L310
      - name: chunk_size
        touch: Only to trade memory for speed; the target-by-library distance matrix is computed in chunks of this many targets.
        source: R/select-neighbours.R#L54
      - name: seed
        touch: For the target clustering and the resemblance check's reference sample; the caller's RNG state is restored afterwards.
        source: R/pipeline-select-training.R#L1164
      - name: verbose
        touch: Set FALSE inside loops.
        source: R/pipeline-select-training.R#L890
    mechanics:
      - step: Validates everything together; refuses a pool that carries validation, evaluation or fitted state, or that is itself a prior selection, because subsetting it would leave that state describing rows it no longer has.
        source: R/pipeline-select-training.R#L947
      - step: Reconciles the axes. Either grid with a hole (a spacing over three times its median and over 30 cm⁻¹) stops the verb before anything interpolates; a pool that does not cover the targets' range stops it, except within half a pool spacing, where the column is clamped with a warning; finer targets warn. The pool is resampled onto the targets' grid through the same spline standardize() uses.
        source: R/select-reconcile.R#L181
      - step: Compares raw absorbance spread before SNV can hide it, warning when the interquartile ranges differ more than twofold, the size of a natural-log against base-10 mismatch.
        source: R/pipeline-select-training.R#L1019
      - step: Builds the similarity space on every pool row, SNV then Savitzky-Golay derivative then optional mask then PCA to the variance target, drops components under the sdev floor, and projects the targets with the pool's loadings.
        source: R/select-space.R#L250
      - step: Per target and per property, finds the k nearest library rows that have the property measured, by the chosen metric, screening with the squared-norm identity and recomputing the kept distances directly so near-identical rows are ranked accurately.
        source: R/select-neighbours.R#L487
      - step: Flags twins, rows at distance zero or below twin_ratio times the 75th percentile of a fixed-width reference set, the target's 50 nearest measured rows, capped at a quarter of the measured rows on a small pool; drops them from the neighbourhood, fetches spares to reach k, and records each exclusion with its property. Under every scope but global the flagged rows are also subtracted from the union, since another target would otherwise draw them back in. Under global the same check runs, per property, in the same space and with the same width, and is reported, but the flagged rows stay in the return; its exclusions and target distances are the ones batch records with the same arguments, so a batch-versus-global comparison has to act on the record.
        source: R/select-neighbours.R#L526
      - step: Groups targets by scope, clustering them by k-means when asked, and builds one groups row per training set.
        source: R/pipeline-select-training.R#L663
      - step: Subsets the reconciled pool to the union, adds .drawn_by and .min_distance as meta columns, plus .group under every scope but sample, and counts rows drawn against rows available per property. Both distance columns are NA under global, and .min_distance is NA when space_rows is "measured" with more than one property, because distances from different spaces have no shared scale.
        source: R/pipeline-select-training.R#L768
      - step: Runs the resemblance check, naming targets whose nearest-library distance exceeds the 99th percentile of the library's own nearest-neighbour distances on a seeded sample of 2,000 rows; a warning, never a stop.
        source: R/pipeline-select-training.R#L1157
      - step: Writes the record, prints the report, and re-validates the object.
        source: R/pipeline-select-training.R#L854
    records:
      - field: .drawn_by, .min_distance, .group
        text: the first two on every returned row, .group under every scope but sample; role meta, so recipes ignore them
        source: R/pipeline-select-training.R#L798
      - field: selection$settings, selection$reconciliation, selection$pool
        text: every lever as resolved including the component count and the window width in cm⁻¹; the grids and the operation applied; the pool's row count and id hash
        source: R/pipeline-select-training.R#L855
      - field: selection$membership, selection$groups, selection$pool_sizes
        text: one row per target, property and pool row with distance, rank, space and whether it was retained; one row per training set; drawn against available per property
        source: R/pipeline-select-training.R#L873
      - field: selection$target_distances, selection$resemblance
        text: each target's nearest and mean-of-k distance, the applicability signal at selection time, and the targets beyond the library's spread
        source: R/pipeline-select-training.R#L876
      - field: selection$exclusions, selection$n_excluded_union, selection$short_draws, selection$units, selection$clustering
        text: the twins by target and reason, how many left the union, draws that could not reach k, the unit comparison, and the clustering when scope is cluster
        source: R/pipeline-select-training.R#L879
      - field: provenance$standardization
        text: when the pool was resampled, the pool's record rewritten to describe the returned axis (the targets' grid, or NULL when they have none or it does not match their columns; the new count and range; resampled TRUE), its standardize() arguments and time kept since they produced the values, and under reconciliation the operation, any end clamp, and the pool's record as it was, original grid included (#90); distinct from selection$reconciliation, and a pool already on the targets' grid keeps its record unchanged
        source: R/pipeline-select-training.R#L416
    refuses:
      - when: either input is not a horizons_data, the pool is promoted or already a selection, the pool has no responses, a property or a named k is missing, twin_ratio is not a single number in (0, 1), or pls is asked for with more than one property
        does: aborts with every failure listed, class horizons_input_error
        source: R/pipeline-select-training.R#L382
      - when: either grid has a hole, or the pool does not cover the targets' range
        does: aborts before anything interpolates
        source: R/select-reconcile.R#L208
      - when: a property has no measured pool rows, or fewer than 2 under space_rows = "measured", under any scope
        does: aborts before the space is built, naming the property
        source: R/pipeline-select-training.R#L457
      - when: a property has fewer measured pool rows than its k, under every scope but global, which caps k there
        does: aborts before any draw, naming the property and its count
        source: R/select-neighbours.R#L508
      - when: the twin subtraction leaves a property with no drawn rows, which a twin_ratio near 1 does, and so do targets that are themselves in the pool
        does: aborts naming the property and the cause, the ratio or the targets' own copies, class horizons_input_error
        source: R/pipeline-select-training.R#L721
      - when: the pool and targets look like different photometric units, targets are finer than the pool, a target overshoots the pool by under half a spacing, a draw cannot reach k after twin exclusion, or targets sit beyond the pool's spread
        does: warns and proceeds
        source: R/pipeline-select-training.R#L476
    evidence:
      - claim: on-library, the batch pool at k = 100 equals the global model and the residual correction takes it to the corrected-global number; off-library the pool beats global by a third
        where: dev/experiments/2026-09-factorial/README.md#same-afternoon-2026-09-22-the-library-ships-whole-and-the-correction-from-the-pool-fit
        value: "Iowa cosine 3.140 → 2.827 against global 3.131; MOYS 0.348 against 0.526"
      - claim: the sdev floor is what makes the Mahalanobis ranking stable to the row set; under Euclidean the all-rows and measured-rows spaces agree to a Jaccard of 0.96 to 1.00 at k = 100
        where: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-21-review-and-test-2b
      - claim: the k default of 400 came from the per-sample locality curve; the batch evidence points lower
        where: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up
        value: "k = 400 lost to k = 100 on Iowa in three experiments"
    issues:
      - id: 66
        text: the twin rule handles a target's own row in the pool but not replicate scans of each other inside the pool; a selected training set is enriched in sibling pairs and the ungrouped folds downstream are optimistic
        source: ../dev/specs/v1-refactor/select-training-design.md#open-questions
    design_ahead:
      - text: one routing argument, library, taking a registered name, a path to a packaged artifact, or a horizons_data; pool goes away and the build recipe is internal
        absent: library
        source: ../dev/specs/v1-refactor/select-training-design.md#the-library-as-a-noun-added-2026-09-21
      - text: the metric default changes from Mahalanobis to cosine on-library and Euclidean off-library, routed by the nearest-library distance
        source: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up
      - text: the residual correction after fit(), gated by the same distance, and its home
        source: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up
      - text: the reconciliation flip and the cached similarity space, so distances are measured in the library's own space and the PCA is not recomputed per call
        source: ../dev/specs/v1-refactor/select-training-design.md#the-library-as-a-noun-added-2026-09-21

  # ---------------------------------------------------------------------------
  - verb: average
    rd: average
    label: collapse replicate scans
    lanes: [local, library]
    order: 2.5
    optional: true
    class_in: horizons_data
    class_out: horizons_data
    summary: >-
      Collapses replicate scans of one sample into one row by averaging the
      spectra, with a correlation-based quality check that drops a replicate
      which disagrees with its siblings. Optional, and only for objects that
      still carry more than one scan per sample; add_response() and
      select_training() both need one row per sample id. Lab values already on
      the object are averaged over the same rows.
    args:
      - name: x
        touch: Always; standardize first, with baseline correction if the scans have offsets, because offset spectra correlate near 1 and would pass the check.
        source: R/pipeline-average.R#L118
      - name: by
        touch: When the replicate grouping is a column other than sample_id, such as one parse_ids() produced; its values become the new sample ids. Refused on an object that carries a selection record.
        source: R/pipeline-average.R#L139
      - name: quality_check
        touch: Leave TRUE unless you have already screened the scans yourself.
        source: R/pipeline-average.R#L791
      - name: correlation_threshold
        touch: Rarely; 0.996 is the mean pairwise correlation a replicate must reach against its siblings.
        source: R/pipeline-average.R#L689
      - name: on_all_outliers
        touch: When a whole group fails the check, decide whether to average it anyway with a warning, drop the sample, or keep only the best replicate.
        source: R/pipeline-average.R#L806
      - name: verbose
        touch: Set FALSE inside loops.
        source: R/pipeline-average.R#L525
    mechanics:
      - step: Validates the arguments together, and refuses a custom `by` on an object with a selection record, because renaming rows would orphan the record.
        source: R/pipeline-average.R#L114
      - step: Validates the object at stage = "raw" before the rebuild below, so a column present in analysis but missing from role_map is refused rather than silently dropped when Step 8 rebuilds the averaged table from role_map's predictor, meta and response columns (#24). Raw stage, since replicate scans sharing a sample_id are exactly what average() collapses.
        source: R/pipeline-average.R#L203
      - step: Groups rows by the `by` column; NA in that column aborts.
        source: R/pipeline-average.R#L243
      - step: Per group with two or more scans, computes each replicate's mean correlation with the others, removes the worst one, and repeats until every survivor clears the threshold or one remains. Iterative so a single bad scan cannot drag its siblings under.
        source: R/pipeline-average.R#L661
      - step: A group whose survivors fall to one is an all-outlier group and is handled by `on_all_outliers`; otherwise the flagged scans are dropped and the rest averaged.
        source: R/pipeline-average.R#L804
      - step: Predictors are column means over the surviving scans. Numeric responses are averaged over the same rows; a non-numeric response that disagrees within a group is an error, not a silent pick.
        source: R/pipeline-average.R#L971
      - step: Meta columns are kept when uniform within the group and dropped otherwise; `filename` is always dropped.
        source: R/pipeline-average.R#L914
      - step: With a custom `by`, that column is coerced to character and becomes `sample_id`, after checks that it produces no NA and no duplicates.
        source: R/pipeline-average.R#L417
      - step: Writes the table back through set_analysis(), which recounts rows and predictors.
        source: R/pipeline-average.R#L465
      - step: Re-validates the whole object structurally before returning it (#24).
        source: R/pipeline-average.R#L504
    records:
      - field: provenance$average
        text: the settings, group and replicate counts before and after, which samples were all-outlier or dropped, which meta columns were dropped, and source_ids, the map from each averaged id to the scans it came from
        source: R/pipeline-average.R#L482
      - field: provenance$aggregation_by
        text: the grouping column, written on every call
        source: R/pipeline-average.R#L498
    refuses:
      - when: an argument is invalid, the by column is missing, or by is custom on a selected object
        does: aborts with every failure listed
        source: R/pipeline-average.R#L172
      - when: an unregistered analysis column, or any other structural problem, is present before the rebuild — average() validates at entry as well as on return (#24)
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-average.R#L203
      - when: the grouping column has NA, or no predictor columns exist
        does: aborts
        source: R/pipeline-average.R#L245
      - when: every sample is dropped by quality control
        does: aborts and suggests on_all_outliers = "warn" or a lower threshold
        source: R/pipeline-average.R#L361
      - when: all replicates of a sample fail and on_all_outliers is "warn"
        does: averages them anyway and warns, naming the samples
        source: R/pipeline-average.R#L510
      - when: a non-numeric response disagrees within a group
        does: aborts naming the column and group
        source: R/pipeline-average.R#L993
      - when: the object fails validate_horizons_data() after averaging
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-average.R#L504

  # ---------------------------------------------------------------------------
  - verb: configure
    rd: configure
    label: name the outcome and the grid
    lanes: [local, library]
    order: 4
    class_in: horizons_data
    class_out: horizons_data
    summary: >-
      Names the outcome and lays out the grid of pipelines to compare: every
      combination of model, response transformation, spectral preprocessing,
      feature selection, and covariate set becomes one configuration with a
      deterministic id. Nothing is fitted. The tuning budget is recorded here
      for evaluate() and fit() to read, and so are the recipe settings every
      configuration shares, the Savitzky-Golay window and the PCA threshold,
      and the outcome's physical range, which every scored and served
      prediction is clamped to. Calling it again replaces the grid,
      demotes the old outcome, clears the named state a previous evaluate() or
      fit() earned, and demotes the class, so one object can be configured per
      outcome in a loop.
    args:
      - name: x
        touch: Always; an object with at least one response column, from add_response() or select_training().
        source: R/pipeline-configure.R#L300
      - name: outcome
        touch: Whenever the object carries more than one response; with exactly one it is chosen for you.
        source: R/pipeline-configure.R#L539
      - name: models
        touch: To change the learners compared. rf, cubist and plsr are the default three; the full list is VALID_MODELS.
        source: R/pipeline-configure.R#L315
      - name: transformations
        touch: For a skewed outcome such as organic carbon, add "log"; the transform is applied per configuration and undone before scoring.
        source: R/pipeline-configure.R#L326
      - name: preprocessing
        touch: To compare spectral pretreatments; these run per configuration inside evaluate(), never on the object, so the same data can be modelled raw and as a derivative.
        source: R/pipeline-configure.R#L337
      - name: feature_selection
        touch: To reduce the predictor space; "pca" is what the tree learners need on a full-resolution spectrum, and boruta is expensive.
        source: R/pipeline-configure.R#L348
      - name: expand_covariates
        touch: Only when the object carries covariate columns; NULL uses all of them in every configuration, TRUE benchmarks the power set, FALSE drops them.
        source: R/pipeline-configure.R#L656
      - name: cov_fusion
        touch: Required when covariates are present, and "early" is the only value that runs, with the requested covariates promoted to predictors beside the spectral features. "late" is refused, because late fusion is designed but not built.
        source: R/utils-recipes.R#L314
      - name: cv_folds
        touch: Rarely; five is the default and validate() checks the object has enough rows for it.
        source: R/pipeline-configure.R#L401
      - name: grid_size
        touch: To widen or shrink the Latin hypercube evaluate() screens each configuration with.
        source: R/pipeline-configure.R#L411
      - name: bayesian_iter
        touch: To change how many Bayesian steps follow the grid in evaluate(); 0 disables them.
        source: R/pipeline-configure.R#L421
      - name: final_bayesian_iter
        touch: To change the re-tuning budget fit() spends on each selected configuration; larger than the screening budget by default.
        source: R/pipeline-configure.R#L431
      - name: sg_window
        touch: Rarely. The window is in grid points, so its physical width follows the resolution the spectra were standardized to; configure() prints the width in cm⁻¹ and evaluate() records the width it ran. One value serves the whole grid and trims (sg_window - 1) / 2 columns from each end under every preprocessing method, raw included, which is why it must suit the second-derivative methods' cubic and be at least 5. For "sg" it is the width of a moving average, so widening it flattens narrow peaks rather than preserving them.
        source: R/pipeline-configure.R#L453
      - name: pca_threshold
        touch: Only with feature_selection = "pca"; lower it to keep fewer components. One value serves every configuration that runs PCA.
        source: R/utils-recipes.R#L253
      - name: outcome_range
        touch: For any outcome that is not non-negative. The default, c(0, Inf), floors every prediction at zero, which is right for concentrations and contents; a signed property such as δ13C or δ15N takes c(-Inf, Inf), and a bounded one such as a percentage may take c(0, 100). Set it from the property's physical bounds, never from the data's minimum and maximum, and prefer -Inf to an arbitrarily low floor, since the floor anchors the response bound fit() stores and a distant one loosens it (for outcomes of 10 to 20, a bound of 530 under c(-1000, Inf) against 25 under c(-Inf, Inf)). Every observed value of the outcome must lie inside it and be finite. A negative floor rules out the log, log10 and sqrt transformations, and rrmse as the ranking metric (#76).
        source: R/pipeline-configure.R#L481
    mechanics:
      - step: Requires at least one response or outcome column, and checks every axis value against the package's valid lists.
        source: R/pipeline-configure.R#L304
      - step: If a grid already exists, warns and resets whatever evaluate(), fit() and ensemble() earned, because it was earned against an outcome that is about to change. The evaluation, models and ensemble slots go back to the constructor's empty shape, the validation verdict and flagged ids are cleared, and the class drops to horizons_data. The record of rows validate() already removed is kept, since they stay removed, and so is a select_training() record.
        source: R/utils-subset.R#L114
      - step: Demotes any previous outcome to response, resolves the outcome (auto when there is exactly one), and promotes it, writing the roles back through set_analysis() so n_responses stays consistent.
        source: R/pipeline-configure.R#L533
      - step: Checks the outcome's observed values against outcome_range once the outcome is resolved, so a signed outcome under the non-negative default is refused here rather than after evaluate() has tuned every configuration (#76). Missing values are ignored; other responses are not checked, since one range belongs to the one outcome.
        source: R/pipeline-configure.R#L578
      - step: Warns about kept rows that were not chosen for this outcome, naming the earlier outcome and the count when validate() removed rows only as response outliers of a different one, and naming the drawn properties when a select_training() record (other than scope global) was drawn for properties that do not include it.
        source: R/pipeline-configure.R#L611
      - step: Resolves the covariate sets, which are none, all, a power set, or a power set of the named ones merged with the rest fixed.
        source: R/pipeline-configure.R#L618
      - step: Crosses the five axes into one row per configuration and gives each a deterministic id, model_preprocessing_transformation_featsel plus a six-character hash of the whole tuple.
        source: R/pipeline-configure.R#L728
      - step: Stores the grid, the tuning budget and the expansion inputs.
        source: R/pipeline-configure.R#L769
      - step: Records the recipe settings build_recipe() applies to every configuration, and prints the window's width in cm⁻¹ on the axis as it stands, from the spacing of the predictor axis itself (the grid step in the provenance is only the fallback, because a select_training() result carries the pool's). The width is not stored, because standardize() can still change the axis. Records the outcome range beside them, and prints it when it is not the default.
        source: R/pipeline-configure.R#L795
      - step: Re-validates the whole object structurally before returning it (#24).
        source: R/pipeline-configure.R#L815
    records:
      - field: data$role_map
        text: exactly one column with role outcome; the others stay response
        source: R/pipeline-configure.R#L596
      - field: config$configs, config$n_configs
        text: one row per configuration with config_id and the five axis values
        source: R/pipeline-configure.R#L752
      - field: config$tuning, config$expansion, config$recipe
        text: the budget evaluate() and fit() read; the original inputs for reproducibility; and the recipe settings, sg_window and pca_threshold, they pass to build_recipe() for every configuration
        source: R/pipeline-configure.R#L795
      - field: config$outcome_range
        text: the outcome's physical range, a length-2 double, which every clamp reads; an object configured before it existed reads as c(0, Inf)
        source: R/pipeline-configure.R#L804
    refuses:
      - when: the object has no response column
        does: aborts and points at add_response()
        source: R/pipeline-configure.R#L304
      - when: a model, transformation, preprocessing, feature-selection method, or cov_fusion value is not in the valid list
        does: aborts listing the valid options
        source: R/pipeline-configure.R#L315
      - when: cov_fusion is "late", or is not NULL or a single string
        does: aborts; for "late" the message says late fusion is not built and to use "early", and the condition is both horizons_configure_error and horizons_input_error
        source: R/pipeline-configure.R#L377
      - when: a tuning parameter is not an integer in range
        does: aborts
        source: R/pipeline-configure.R#L401
      - when: sg_window is not an odd integer of at least 5, or pca_threshold is not a single number in (0, 1]
        does: aborts
        source: R/pipeline-configure.R#L453
      - when: outcome_range is not two numbers with lower below upper
        does: aborts
        source: R/pipeline-configure.R#L481
      - when: outcome_range has a negative lower bound and transformations include log, log10 or sqrt, which are undefined for negative values and whose back-transforms floor the predictions
        does: aborts naming both arguments, class horizons_configure_error
        source: R/pipeline-configure.R#L500
      - when: an observed value of the outcome lies outside outcome_range, a negative value under the default among them, or is infinite
        does: aborts, naming outcome_range and saying to set it to the property's physical bounds, c(-Inf, Inf) for a signed property; the condition is both horizons_configure_error and horizons_input_error
        source: R/pipeline-configure.R#L578
      - when: several responses exist and outcome is not given, or the named outcome is not a response
        does: aborts listing the responses
        source: R/pipeline-configure.R#L547
      - when: covariates exist and cov_fusion is NULL, or expand_covariates names a column the object lacks
        does: aborts
        source: R/pipeline-configure.R#L646
      - when: a grid already exists, or cov_fusion = "early" or expand_covariates is given with no covariates
        does: warns and continues
        source: R/pipeline-configure.R#L520
      - when: rows were removed only as response outliers of a different outcome, or the training rows were drawn by select_training() for properties that exclude the outcome
        does: warns and continues; the rows stay as they are
        source: R/pipeline-configure.R#L1192
      - when: the object fails validate_horizons_data() after the grid is stored
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-configure.R#L815
    notes:
      - text: Cubist with committees > 1 is not bit-reproducible under a fixed seed (fourth significant figure of a fold metric); every other engine is deterministic given seed. See #51.
        source: R/pipeline-configure.R#L51
      - text: cubist and svm_rbf/mars scale badly with predictor count on full-resolution spectra; the "Choosing models for large spectral libraries" section documents practical n x p limits per learner, and validate()'s P010 check warns for cubist + feature_selection = "none" specifically. See #40.
        source: R/pipeline-configure.R#L65

  # ---------------------------------------------------------------------------
  - verb: validate
    rd: validate
    label: pre-flight checks and outliers
    lanes: [local, library]
    order: 5
    class_in: horizons_data
    class_out: horizons_data
    summary: >-
      The pre-flight report between configure() and evaluate(). Checks that
      there are enough rows for the folds, that the outcome varies and is mostly
      present, and that no predictor is constant; detects spectral outliers by
      Mahalanobis distance on PCA scores of the raw spectra and response
      outliers by Tukey fences. Detection is always on; removal is opt-in, and
      only spectral outliers are removed here. A request to remove response
      outliers is recorded for evaluate(), which fences its training partition
      alone, so the test set is never trimmed on its own labels (#77). Only
      ERROR-severity failures set passed to FALSE, and passed is advisory: no
      verb reads it, so a failed validation has to be acted on by the caller.
    args:
      - name: x
        touch: Always; must be configured, so the outcome and the fold count are known.
        source: R/pipeline-validate.R#L144
      - name: remove_outliers
        touch: '"spectral" to drop the spectral outliers here, through subset_rows(), so a selection record is kept consistent; "response" to have evaluate() (and fit()''s cold start) trim the training rows outside fences from its training partition, removing nothing here; TRUE for both. The default only reports.'
        source: R/pipeline-validate.R#L473
      - name: spectral_method
        touch: Never; "mahalanobis" is the only method.
        source: R/pipeline-validate.R#L167
      - name: spectral_threshold
        touch: To loosen or tighten the chi-squared quantile the squared distance is cut at; 0.975 by default.
        source: R/pipeline-validate.R#L761
      - name: response_method
        touch: Never; "iqr" is the only method.
        source: R/pipeline-validate.R#L178
      - name: response_threshold
        touch: The Tukey multiplier, for the whole-table flags and for the training-partition fences evaluate() trims by; 1.5 flags the conventional outer fences, 3 flags only extremes.
        source: R/pipeline-validate.R#L807
    mechanics:
      - step: Requires a configured object, validates the arguments, and warns if a previous validation is being overwritten.
        source: R/pipeline-validate.R#L144
      - step: Counts rows with a non-missing outcome, which is what evaluate() will actually model, and reads cv_folds from the tuning record.
        source: R/pipeline-validate.R#L249
      - step: P007 near-zero-variance predictors (warning); P001 at least 50 rows (warning); P001b at least twice cv_folds modelable rows (error); P002 at least ten rows per fold (warning); P003 outcome variance above zero (error); P004 outcome missing in at most 20 % (warning).
        source: R/pipeline-validate.R#L312
      - step: Spectral outliers, P005 (info), by PCA on the raw spectra scaled to unit variance per wavenumber, components to 99 % of variance capped at 50 and at two fewer than the row count, then the squared Mahalanobis distance of each score vector against the chi-squared quantile. Skipped with a warning below five rows or on a singular covariance.
        source: R/pipeline-validate.R#L689
      - step: Response outliers, P006 (info), as outcome values outside Q1 minus and Q3 plus the multiplier times the IQR, over the whole table and for information only. Skipped with a warning below four non-missing values or a zero IQR. The fence rule is one helper, which evaluate()'s training-partition trim uses too.
        source: R/pipeline-validate.R#L782
      - step: P010 (warning) flags configs pairing cubist with feature_selection = "none" once n_rows * n_predictors exceeds CUBIST_MAX_CELLS; the CLI tree line always shows the cell count, and a cli_warn() names the affected config_ids and recommends feature_selection = "pca" when any are flagged.
        source: R/pipeline-validate.R#L437
      - step: If spectral removal was asked for (TRUE or "spectral"), drops the spectral outliers through subset_rows() and records each with its threshold; a row outside both kinds of fence is removed as spectral.
        source: R/pipeline-validate.R#L486
      - step: A response request (TRUE or "response") removes nothing. Fences over the whole table span the rows evaluate() will hold out, so removing on them before any split took the test set's hardest cases out by their own labels (#77). It is recorded as a request (outcome, method, threshold) for evaluate().
        source: R/pipeline-validate.R#L545
      - step: The flags and the request are replaced on every call, but the removal record accumulates, since rows an earlier call removed (before a re-configure, say) are gone for good. configure() clears the request with the verdict.
        source: R/pipeline-validate.R#L550
      - step: passed is TRUE when no ERROR check failed; warnings do not affect it.
        source: R/pipeline-validate.R#L528
      - step: Re-validates the whole object structurally before returning it (#24).
        source: R/pipeline-validate.R#L568
    records:
      - field: validation$passed, validation$timestamp
        text: the verdict and when it was reached
        source: R/pipeline-validate.R#L536
      - field: validation$checks
        text: one row per check with description, status, severity (blank on passes), value and id
        source: R/pipeline-validate.R#L542
      - field: validation$outliers
        text: the spectral and response ids this call flagged; response_trim, the request evaluate() reads, or NULL; and the record of every removal so far, one detail row per removed sample with its reason, the outcome, and the spectral and response thresholds. Rows this version removes are spectral; "response" and "both" rows come from an earlier version that removed rows on their labels, and evaluate() and fit() warn about the "response" ones (a "both" row would have gone as a spectral outlier anyway)
        source: R/pipeline-validate.R#L558
    refuses:
      - when: the object is not configured, or an argument is out of range, or more than one outcome is configured, or the outcome column is missing from the table
        does: aborts, class horizons_validate_error
        source: R/pipeline-validate.R#L144
      - when: too few rows or columns for a detector, or a singular covariance
        does: warns and skips that detector
        source: R/pipeline-validate.R#L694
      - when: a previous validation exists
        does: warns and overwrites it
        source: R/pipeline-validate.R#L211
      - when: the object fails validate_horizons_data() after checks and any removal
        does: aborts with the validator's findings, class horizons_validation_error
        source: R/pipeline-validate.R#L568
    notes:
      - text: P010's 2e6-cell threshold (CUBIST_MAX_CELLS) is a heuristic floor from one measurement, not a calibrated benchmark — cubist + snv on 14,228 x 851 (12.1M cells) did not finish a single tune task in 29.5 minutes, while feature_selection = "pca" on the same config finished in 368 s. See #40.
        source: R/constants.R#L355

  # ---------------------------------------------------------------------------
  - verb: evaluate
    rd: evaluate
    label: tune and rank every configuration
    lanes: [local, library]
    order: 6
    class_in: horizons_data
    class_out: horizons_eval
    summary: >-
      Screens every configuration in the grid. Holds out {split_test} of the rows as a
      test set, tunes each configuration on the remaining {split_train} by a Latin
      hypercube grid and then Bayesian optimization, scores it on the test set,
      and ranks the configurations by the cross-validated metric at each one's
      chosen hyperparameters. The test-set numbers are reported but never used
      to choose, so they stay honest. When validate() requested a response
      trim, the training rows outside Tukey fences computed on the training
      partition alone are dropped before the folds; test rows are never
      trimmed on their labels (#77). Checkpoints per configuration when given
      a directory, and can dispatch configurations or folds onto a future plan
      the caller registered. Promotes the object to horizons_eval.
    args:
      - name: x
        touch: Always; a configured object, certified against the base data contract at entry (#24).
        source: R/pipeline-evaluate.R#L224
      - name: metric
        touch: To rank by something other than RPD; the ranking reads the cross-validated column of that metric.
        source: R/pipeline-evaluate.R#L878
      - name: prune
        touch: Leave TRUE. Since tuning metrics moved to the original response scale (#49), the grid RPD the gate reads is comparable across transformations, which closed the second half of #38. Set FALSE only to spend Bayesian iterations on every configuration regardless of its grid performance; FALSE also leaves below_prune_threshold unrecorded, so fit() cannot warn when no member cleared the threshold.
        source: R/evaluate-single-config.R#L305
      - name: prune_threshold
        touch: The grid-search RPD below which Bayesian optimization is skipped; 1.0 is "no better than the mean".
        source: R/evaluate-single-config.R#L309
      - name: allow_par
        touch: TRUE after registering a future plan; evaluate() never registers one. FALSE ignores any plan.
        source: R/pipeline-evaluate.R#L307
      - name: parallelize_over
        touch: '"configs" for a large grid on many cores, "resamples" for a short grid on few; "auto" picks configs when the grid is at least cv_folds long.'
        source: R/pipeline-evaluate.R#L307
      - name: output_dir
        touch: Always for a long run; required when configurations are dispatched to workers. Each configuration is checkpointed to its own file under checkpoints/ and a rerun resumes, refusing checkpoints written on other training data (other samples, outcome, id/outcome/predictor/covariate columns, or values, so re-standardized spectra count) or tuned under different settings. Keep one directory per outcome; changing only the ranking metric, or adding a sibling response or meta column, resumes.
        source: R/pipeline-evaluate.R#L455
      - name: seed
        touch: To change the split and the folds; the same seed reproduces the run for every engine except Cubist with committees.
        source: R/pipeline-evaluate.R#L357
      - name: verbose
        touch: Set FALSE inside loops.
        source: R/pipeline-evaluate.R#L489
      - name: workers
        touch: Never; deprecated and ignored with a warning. Register a plan instead.
        source: R/pipeline-evaluate.R#L196
    mechanics:
      - step: Certifies the base data contract at entry, at the full stage, so a column added after configure() without a role_map entry — by a later parse_ids(), or a direct assignment — cannot reach build_recipe()'s outcome ~ . formula undetected (#24). validate_horizons_eval() at return checks the evaluation slot, not this.
        source: R/pipeline-evaluate.R#L209
      - step: Checks the metric and the grid, drops rows whose outcome is NA, and requires at least twice cv_folds rows.
        source: R/pipeline-evaluate.R#L215
      - step: Refuses an outcome with an observed value outside configure()'s outcome_range before any split or tuning (#76). configure() refuses it too, but an object configured before the range existed reads as c(0, Inf), and rows can change after configure().
        source: R/pipeline-evaluate.R#L258
      - step: Refuses a Savitzky-Golay window that is not narrower than the spectrum, before any configuration runs. configure() cannot make this check, because standardize() can still change the axis after it; left to the recipe, the window failed every configuration inside tune without being named. fit()'s cold start applies the same check.
        source: R/pipeline-evaluate.R#L298
      - step: Resolves the parallel axis against the registered plan, downgrading to sequential with a warning when the plan offers fewer than two workers, and pins BLAS and thread counts in the parent before any dispatch.
        source: R/pipeline-evaluate.R#L307
      - step: Splits {split_ratio} stratified on the outcome, by the draw fit() also makes when it starts cold, and builds cv_folds folds on the training part stratified the same way. A draw comes out unstratified when rsample cannot bin the outcome (under 40 rows, or bins that collapse to one, as a mostly-zero outcome's do) or the stratified draw fails, and the tree's Split and Tuning lines say which (#91); the folds can be unstratified under a stratified split. Then fingerprints the training data (the outcome, the sample ids, which columns hold the id, outcome, predictor and covariate roles, and the outcome, predictor and covariate values, once per run) so a checkpoint from other rows or other values cannot be resumed.
        source: R/pipeline-evaluate.R#L357
      - step: If validate() recorded a response trim, trim_training_responses(), which fit()'s cold start also calls after the same draw, then computes Tukey fences from the training partition's outcome values alone and drops the training rows outside them, before the folds are drawn and the fingerprint is taken; test rows are never removed on their labels, so changing one cannot move the trim. The trim draws nothing from the RNG. With no fences to draw (under four values, or a zero IQR) nothing is trimmed, with a warning. The tree says how many training rows went, the fences, and that the test rows are untouched. The CV folds come from the trimmed rows, so the cross-validated metrics describe the trimmed population; the test metrics do not.
        source: R/pipeline-evaluate.R#L2454
      - step: Records the tuning settings a result row depends on (cv_folds, grid_size, bayesian_iter, prune, prune_threshold when pruning, seed, configure()'s sg_window, pca_threshold and outcome_range, which the config id does not carry, and the response trim's threshold, NA when none was requested), so a checkpoint tuned, preprocessed, clamped or trimmed differently cannot be resumed either. The metric is left out, since every row carries all six cv_ metrics.
        source: R/pipeline-evaluate.R#L420
      - step: Loads the per-config checkpoints, the only store, plus the rows of a legacy eval_checkpoint.rds for configurations with no per-config file, which it copies across. A file counts only under its own configuration's name, so a leftover temp file cannot shadow it. Every row passes one gate order, fingerprint and settings (a mismatch aborts) then scoring schema (an older one is dropped); rows for configurations no longer in the grid are dropped, a file that cannot be used warns, and rows with no fingerprint warn once.
        source: R/pipeline-evaluate.R#L1286
      - step: Writes a manifest carrying the fingerprint and settings, so monitor_evaluate() can watch the run and gate the checkpoints the way evaluate() does.
        source: R/pipeline-evaluate.R#L571
      - step: Per configuration, evaluate_single_config() builds the recipe, with the object's recorded window and PCA threshold, and the model spec, finalizes the parameter ranges, runs the grid, reads the prune gate (recording whether the grid RPD fell below prune_threshold, and skipping Bayesian optimization for those only when there is a Bayesian stage to skip), runs Bayesian optimization, selects the best hyperparameters, records the cross-validated panel at that point, and fits and scores once on the held-out test rows on the original scale, with the predictions clamped to the outcome range (a floor at zero under the default). A transformed response's tuning metrics clamp the same way.
        source: R/evaluate-single-config.R#L66
      - step: On the configs axis, each configuration is one future carrying only what it needs; workers load the installed package, so dispatch is refused under devtools::load_all().
        source: R/pipeline-evaluate.R#L797
      - step: With bayesian_iter = 0, relabels checkpointed rows still marked pruned as successes, since there the gate skipped nothing. Ranks the successful configurations by cv_<metric>, falling back to pruned ones, with a tie-break on config_id, and names the winner.
        source: R/pipeline-evaluate.R#L867
      - step: Empties the models and ensemble slots, which were built on the evaluation being replaced, so a fitted or ensembled object comes back a plain horizons_eval.
        source: R/pipeline-evaluate.R#L911
      - step: Promotes the class to horizons_eval and certifies the evaluation slot against its contract.
        source: R/pipeline-evaluate.R#L937
    records:
      - field: evaluation$results
        text: one row per configuration with status (success, pruned, failed; pruned means Bayesian refinement was skipped), whether its grid RPD fell below prune_threshold and the threshold, the six test metrics, the six cv_ metrics, the selected hyperparameters, warnings, runtime, the scoring schema, the training-data fingerprint, and the tuning settings
        source: R/pipeline-evaluate.R#L913
      - field: evaluation$best_config, evaluation$rank_metric
        text: the winner and the metric it won on
        source: R/pipeline-evaluate.R#L915
      - field: evaluation$screened
        text: TRUE, since the configurations were ranked; fit()'s cold start from a single configuration writes FALSE
        source: R/pipeline-evaluate.R#L917
      - field: evaluation$split, evaluation$n_train, evaluation$n_test
        text: the rsplit itself, so the partition can be replayed; after a response trim its data lacks the trimmed training rows, and n_train counts the rows left
        source: R/pipeline-evaluate.R#L918
      - field: evaluation$response_trim
        text: the training-partition response trim, or NULL when none was requested; the outcome, method and threshold, fences_from ("training"), the lower and upper fences, n_training (the training rows they were computed over), trimmed_ids, and skipped (NA, or why no fences could be drawn). fit() drops exactly these rows rather than recomputing fences
        source: R/pipeline-evaluate.R#L918
      - field: evaluation$parallelize_over, evaluation$workers
        text: the axis actually used and the worker count the plan offered
        source: R/pipeline-evaluate.R#L924
      - field: evaluation$recipe
        text: the sg_window and pca_threshold every configuration's recipe ran with, and sg_window_cm, the window's width in cm⁻¹ on the axis it ran on, so the runs of an sg_window sweep can be told apart
        source: R/pipeline-evaluate.R#L928
    refuses:
      - when: x carries an analysis column with no role_map entry, or (full stage) a duplicate/NA sample_id or a non-finite predictor value
        does: aborts
        source: R/pipeline-evaluate.R#L209
      - when: the metric is unknown, no grid exists, the analysis table lacks the outcome column or every outcome is NA, or there are fewer than twice cv_folds rows
        does: aborts, naming the outcome column when it is absent
        source: R/pipeline-evaluate.R#L215
      - when: configurations would be dispatched to workers with no output_dir
        does: aborts
        source: R/pipeline-evaluate.R#L329
      - when: a checkpoint was written on other training data (other samples, outcome, id/outcome/predictor/covariate columns, or values)
        does: aborts naming what differs, and any settings that also differ
        source: R/pipeline-evaluate.R#L1905
      - when: a checkpoint was tuned under different settings, or, under a range other than the default, was written before the range was recorded (and so scored with the zero floor)
        does: aborts naming each setting that differs
        source: R/pipeline-evaluate.R#L1640
      - when: parallel dispatch is requested under devtools::load_all()
        does: aborts
        source: R/pipeline-evaluate.R#L797
      - when: no configuration can be ranked, because every one failed, was pruned without a rankable metric, or succeeded without one (rows checkpointed before the cv_ columns)
        does: aborts with class horizons_all_configs_failed, listing the first three distinct errors with the configurations that raised them and naming any loaded from checkpoints, which a re-run resumes rather than re-runs; the results table travels on the condition as results, since evaluation$results is never assigned, so a loop over subsets can catch the class and keep the errors, and rlang::last_error()$results recovers it after the fact
        source: R/pipeline-evaluate.R#L2058
      - when: an observed value of the outcome lies outside configure()'s outcome_range (for an object configured before the range existed, a negative value), or is infinite
        does: aborts before any split or configuration, class horizons_input_error, naming outcome_range and how to set it
        source: R/pipeline-evaluate.R#L258
      - when: metric is rrmse and outcome_range has a negative lower bound, where the mean outcome it divides by can be zero or negative and a smaller value is no longer a better model
        does: aborts before any split or configuration, class horizons_input_error
        source: R/pipeline-evaluate.R#L264
      - when: validate()'s response-trim request was recorded for another outcome than the one configured (configure() clears it, so only a hand-edited object carries one)
        does: aborts, class horizons_input_error
        source: R/pipeline-evaluate.R#L2383
      - when: an earlier version's validate() removed rows on their labels before any split (removal_detail rows with reason "response"; a "both" row went as a spectral outlier too, and is not counted)
        does: warns, class horizons_response_trim_warning, that the test metrics exclude those rows, says so in the tree, and evaluates
        source: R/pipeline-evaluate.R#L2551
      - when: configure()'s sg_window is not narrower than the spectrum on the axis the object now has
        does: aborts before any configuration runs, naming the window, its width in cm⁻¹ and the column count, class horizons_input_error
        source: R/pipeline-evaluate.R#L2644
      - when: the registered plan has fewer than two workers, checkpoints lack a fingerprint or settings, or a configuration's cv metric is NA
        does: warns and continues
        source: R/pipeline-evaluate.R#L1448
      - when: a checkpoint file cannot be read
        does: warns naming it and re-evaluates the configuration
        source: R/pipeline-evaluate.R#L1419
    evidence:
      - claim: ranking on the test set would make the winner's test metric a maximum over the grid rather than a held-out estimate
        where: R/pipeline-evaluate.R#L806
        value: "#50"
      - claim: a closure defined inside evaluate() shipped 2.26 GiB per future against 232 MB of needed inputs, which is why the worker is a top-level function
        where: R/pipeline-evaluate.R#L2333
      - claim: after the serialization fixes the per-worker payload on the configs axis is 418 MB at 17,788 by 1,701
        where: R/constants.R#L279

  # ---------------------------------------------------------------------------
  - verb: fit
    rd: fit
    label: re-tune the best and fit them for deployment
    lanes: [local, library]
    order: 7
    class_in: horizons_eval
    class_out: horizons_fit
    summary: >-
      Takes the top configurations from evaluate() and reuses its {split_ratio}
      split, so the final models are scored on evaluate()'s held-out rows, which
      nothing was selected on. Re-tunes each configuration with warm-started
      Bayesian optimization, keeps their out-of-fold predictions for stacking
      (and for the residual correction, once that is built), fits the final
      model on the training part, and scores it on the test part. With UQ or AD
      on, a further {calib_held} of the training part is held out to calibrate
      conformal intervals and the applicability domain. Promotes the object to
      horizons_fit. With a single configuration there is nothing to screen, so
      a configured object can skip evaluate(): fit() draws the split
      evaluate() would at the same seed and re-tunes from a space-filling
      grid.
    args:
      - name: x
        touch: Always; the horizons_eval from evaluate(), or a configured object with exactly one configuration, which fit() starts cold without evaluate(), certified against the base data contract at entry either way (#24).
        source: R/pipeline-fit.R#L173
      - name: n_best
        touch: How many configurations to carry forward; five by default, capped at the number that succeeded, or at the number pruned with a cross-validated metric when none did. One is enough for a single deployable model; several are what ensemble() stacks. A cold start fits its one.
        source: R/pipeline-fit.R#L315
      - name: metric
        touch: Rarely; defaults to the metric evaluate() ranked on, read from the cross-validated column, and must be one evaluate() accepts. On a cold start it ranks nothing and is only recorded; it defaults to the one a cold-started fit recorded, else rpd.
        source: R/pipeline-fit.R#L189
      - name: compute_uq
        touch: FALSE to skip conformal intervals. The fit regains the whole training part only when compute_ad is FALSE too, because the calibration split is drawn whenever either capability is on, and it is what shrinks the rows with out-of-fold predictions from {split_train} to {fit_rows_share}.
        source: R/pipeline-fit.R#L469
      - name: compute_ad
        touch: FALSE to skip the applicability-domain bundle; it shares the calibration split with UQ.
        source: R/pipeline-fit.R#L469
      - name: allow_par
        touch: TRUE after registering a future plan to parallelise the folds inside each re-tune; fit() never dispatches configurations to workers because a fitted object is hundreds of MB.
        source: R/pipeline-fit.R#L252
      - name: seed
        touch: To change the folds, and the calibration split, which is seeded at seed + 1. The train/test split is evaluate()'s, so this seed does not move it, except on a cold start, where fit() draws that split at this seed as evaluate() would.
        source: R/pipeline-fit.R#L471
      - name: verbose
        touch: Set FALSE inside loops.
        source: R/pipeline-fit.R#L534
    mechanics:
      - step: Certifies the base data contract at entry, at the full stage, so a column added after configure() without a role_map entry cannot reach build_recipe()'s outcome ~ . formula undetected (#24). validate_horizons_fit() at return checks the models slot, not this. Runs on both paths, after the cold start (if any) has populated evaluation.
        source: R/pipeline-fit.R#L234
      - step: Checks metric against the metrics evaluate() accepts, then, on either path, refuses an outcome with an observed value outside configure()'s outcome_range before anything is drawn or fitted (#76). Given a configured object with exactly one configuration, or a fit that started that way, starts cold. Draws the {split_ratio} split evaluate() would at seed, by the draw evaluate() uses and after evaluate()'s checks (a floor of twice cv_folds rows, and a Savitzky-Golay window narrower than the spectrum), and records an unscreened evaluation in evaluate()'s place, with screened FALSE and the configuration not_evaluated, carrying no metrics or parameters, and the recipe settings as evaluate() records them. A response trim validate() requested is applied to that split's training partition by the helper evaluate() uses, so a cold start leaves out the rows evaluate() would.
        source: R/pipeline-fit.R#L173
      - step: Otherwise requires a horizons_eval with results. Confirms a parallel backend if asked, takes the configurations evaluate() chose best_config from (the successful ones or, when none succeeded, the pruned ones with a cross-validated metric; on a cold start, the one configuration), ranks them by the cross-validated metric, takes the top n_best, and warns if every one of them fell below evaluate()'s prune threshold.
        source: R/pipeline-fit.R#L236
      - step: Drops rows whose outcome is NA by the rule evaluate() applies, and says how many in the tree.
        source: R/pipeline-fit.R#L346
      - step: Takes evaluate()'s {split_ratio} split as Split F, so the test part is evaluate()'s held-out rows, after checking that its id and outcome columns match those rows value for value and in order. Columns added since evaluate(), such as a sibling response, come along into the fit.
        source: R/pipeline-fit.R#L370
      - step: Leaves out the training rows evaluate() trimmed as response outliers, read from evaluation$response_trim rather than recomputed, before that check; the folds are drawn from what is left, and the test part stays untrimmed. The tree says how many rows went. An object an earlier version's validate() trimmed on its labels before any split warns, class horizons_response_trim_warning, that the test metrics exclude them.
        source: R/pipeline-fit.R#L389
      - step: If UQ or AD is on, splits the training part {calib_ratio} again, at seed + 1, into the fit rows and a calibration set; both capabilities are disabled together if the calibration set is under 30 rows. After a response trim the split is drawn from the untrimmed training part (the trimmed rows are training rows, never test rows) and the trimmed rows are then dropped from the fit rows only, so the calibration set UQ and AD share is exchangeable with the untrimmed rows they will be asked about; a trimmed pool undercovered the extremes, silently. Calibration rows never train, and test rows never calibrate.
        source: R/pipeline-fit.R#L469
      - step: Builds cv_folds folds on the fit rows, at seed, stratified on the outcome as evaluate()'s draws are, and says in the tree whether each of its draws stratified.
        source: R/pipeline-fit.R#L521
      - step: Per configuration, fit_single_config() rebuilds the recipe, with the same window and PCA threshold evaluate() used (on a cold start, the ones the object's configuration records), and the workflow, re-tunes with Bayesian optimization on its own final budget, warm-started from evaluate()'s best parameters or, with none to use (always, on a cold start), from a space-filling grid of grid_size points, which the tree reports and models$results records, finalizes, generates out-of-fold predictions over the folds and back-transforms them, clamped to the outcome range, computes fold-wise metrics, fits the final model on the fit rows, and scores it on the test part, clamped the same way.
        source: R/fit-single-config.R#L57
      - step: Flags a configuration as degraded when its test RPD falls below the cross-validated mean minus two standard errors. After a response trim the CV ran inside the fences, so the test RPD compared is the one over the test rows inside them, and the reason says so; the reported test metrics stay untrimmed.
        source: R/fit-single-config.R#L646
      - step: With UQ on, trains a quantile forest on the out-of-fold residuals and computes signed conformal scores on the calibration set; with AD on, estimates the feature-space centroid and a Ledoit-Wolf shrinkage covariance and calibrates the quartile and out-of-domain cutoffs on the same calibration set. Both run before the workflow is butchered for storage.
        source: R/fit-single-config.R#L512
      - step: Assembles the workflows in best-first order, the stacked out-of-fold predictions keyed to a row index, the results table, the response bound (computed over the fit rows, the ones the final models are trained on, and any rows a response trim left out of them, as their maximum plus half the span from the outcome range's lower bound, or from their minimum when that bound is -Inf, capped at a finite upper bound; under the default range it is 1.5 times the maximum, as it was before the range existed), and whether the training object carried a selection record; promotes to horizons_fit and certifies the models slot. On a horizons_ensemble, the ensemble slot is emptied first, since it was built on the members being replaced.
        source: R/pipeline-fit.R#L998
    records:
      - field: models$workflows, models$n_models, models$best_config, models$rank_metric
        text: the butchered fitted workflows by config_id in best-first order
        source: R/pipeline-fit.R#L998
      - field: models$cv_predictions, models$row_index
        text: out-of-fold predictions (.row, .fold, config_id, .pred, .pred_trans, truth) and the .row to sample_id map; what ensemble() stacks, and what the designed but unbuilt residual correction would read
        source: R/pipeline-fit.R#L912
      - field: models$results
        text: per configuration, status, degraded flag and reason, the six test metrics, the cv RMSE and RPD with standard errors, best parameters, whether the re-tune was warm-started and the size of its starting grid, the error message of a failed configuration, runtime
        source: R/pipeline-fit.R#L869
      - field: models$split, models$predictor_schema, models$response_bound, models$selection_present
        text: Split F; the training-axis predictor columns predict() checks new data against; the winsorization bound, computed over the fit rows and any training rows a response trim left out of them, and above their maximum for an outcome of any sign; whether conformal exchangeability can be assumed
        source: R/pipeline-fit.R#L971
      - field: models$uq, models$ad
        text: per-configuration bundles, present only for configurations that succeeded with enough calibration rows
        source: R/pipeline-fit.R#L918
      - field: evaluation$screened, evaluation$results, evaluation$recipe, evaluation$response_trim, on a cold start
        text: the unscreened record fit() writes in evaluate()'s place, screened FALSE, the one configuration as best_config with status not_evaluated and NA metrics, the split drawn at seed, the recipe settings and response trim as evaluate() records them, and no run provenance
        source: R/pipeline-fit.R#L1221
    refuses:
      - when: the input is neither a horizons_eval nor a horizons_data, an evaluation has no results, or no configuration either succeeded or was pruned with a cross-validated metric, or none of those has one
        does: aborts
        source: R/pipeline-fit.R#L177
      - when: x carries an analysis column with no role_map entry, or a duplicate/NA sample_id or a non-finite predictor value
        does: aborts
        source: R/pipeline-fit.R#L234
      - when: metric is not one evaluate() accepts, on either path
        does: aborts with class horizons_input_error before anything is drawn or fitted, naming the metrics it accepts
        source: R/pipeline-fit.R#L191
      - when: an observed value of the outcome lies outside configure()'s outcome_range or is infinite, on either path
        does: aborts with class horizons_input_error before anything is drawn or fitted, naming outcome_range and how to set it
        source: R/pipeline-fit.R#L203
      - when: the ranking metric (given, or evaluate()'s) is rrmse and outcome_range has a negative lower bound
        does: aborts with class horizons_input_error before anything is drawn or fitted
        source: R/pipeline-fit.R#L208
      - when: on the evaluate() path, outcome_range differs from the range evaluate() recorded on its results rows, counting rows from before the range was recorded as the default
        does: aborts with class horizons_input_error before anything is fitted, naming both ranges and saying to re-run evaluate()
        source: R/pipeline-fit.R#L215
      - when: a configured object that has not been through evaluate() has no configuration or more than one, fewer than twice cv_folds rows with an observed outcome, or a Savitzky-Golay window at least as wide as the spectrum
        does: aborts with class horizons_input_error before anything is drawn; with several configurations it says to run evaluate(), which is what chooses among them, and the window check is evaluate()'s own
        source: R/pipeline-fit.R#L1142
      - when: every member it fits fell below evaluate()'s prune threshold, whether pruned (the fallback, when none succeeded) or not (bayesian_iter = 0, where nothing is pruned)
        does: warns with class horizons_below_threshold_warning, naming the threshold and each member's cv RPD, and fits them; in the fallback the warning also carries horizons_pruned_fallback_warning
        source: R/pipeline-fit.R#L323
      - when: evaluation$split is missing, or its ids or outcomes no longer match the rows the object models, because the rows or outcomes changed after evaluate() or the object was built by hand
        does: aborts, and says to re-run evaluate()
        source: R/pipeline-fit.R#L374
      - when: n_best exceeds the configurations available, or the calibration set is under 30 rows
        does: prints a console note and continues with what it can; the note is a tree line, so verbose = FALSE silences it
        source: R/pipeline-fit.R#L315
      - when: a configuration fails to re-tune or fit
        does: records the failure and its error message in models$results and continues; butchering failure falls back to storing the unbutchered workflow
        source: R/fit-single-config.R#L116
      - when: every configuration fails
        does: aborts with class horizons_all_members_failed, listing the first three distinct errors with the configurations that raised them; the per-member results travel on the condition as results
        source: R/pipeline-fit.R#L1325
    evidence:
      - claim: out-of-fold predictions cover {split_train} of the rows with an observed outcome with UQ and AD off, and {fit_rows_share} with them on
        where: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up
      - claim: a Split F drawn afresh at seed + 1 took a median 79 % of its test rows from evaluate()'s training rows, which chose the members and tuned the warm-start parameters (200 seeds, n = 250); that is why fit() reuses evaluate()'s split
        where: R/pipeline-fit.R#L359

  # ---------------------------------------------------------------------------
  - verb: ensemble
    rd: ensemble
    label: stack the fitted models
    lanes: [local, library]
    order: 8
    optional: true
    class_in: horizons_fit
    class_out: horizons_ensemble
    summary: >-
      Trains a meta-learner over the models fit() produced, using their
      out-of-fold predictions as features and scoring the result on the same
      Split F test rows, so the ensemble's metrics are comparable to the single
      models'. Three meta-learners: a glmnet penalized regression, a fixed
      inverse-RMSE weighted average, or an xgboost learner. Optional; a single
      fitted model predicts without it. Calibrates CV+ conformal intervals for
      the ensemble by default.
    args:
      - name: x
        touch: Always; a horizons_fit with at least two successful members.
        source: R/pipeline-ensemble.R#L92
      - name: method
        touch: '"weighted" when the members are few and you want an inspectable rule; "xgb" when member errors interact; the penalized default otherwise.'
        source: R/pipeline-ensemble.R#L179
      - name: optimize
        touch: FALSE to use fixed defaults instead of tuning the meta-learner by cross-validation on the out-of-fold matrix.
        source: R/pipeline-ensemble.R#L179
      - name: seed
        touch: To change the meta-learner's folds; the ensemble UQ partition is drawn at seed + 1000.
        source: R/pipeline-ensemble.R#L179
      - name: compute_uq
        touch: FALSE to skip the CV+ interval calibration.
        source: R/pipeline-ensemble.R#L203
      - name: allow_par
        touch: TRUE after registering a future plan; folds of the meta-learner's tuning run on it.
        source: R/pipeline-ensemble.R#L129
      - name: verbose
        touch: Set FALSE inside loops.
        source: R/pipeline-ensemble.R#L218
    mechanics:
      - step: Requires a horizons_fit and a known method, and confirms a parallel backend if asked.
        source: R/pipeline-ensemble.R#L92
      - step: Gathers the members, the configurations with both a fitted workflow and out-of-fold predictions, and pivots their out-of-fold predictions into one matrix keyed by row.
        source: R/ensemble-helpers.R#L35
      - step: Dispatches to the engine. Penalized fits glmnet on the matrix and reads its coefficients back as member weights; weighted uses inverse out-of-fold RMSE, or equal weights when optimize is FALSE; xgb fits an xgboost meta-learner and reports importance.
        source: R/pipeline-ensemble.R#L179
      - step: Every engine returns the same contract, with method, model, weights, predictions and metrics on Split F's test rows, member metrics, the improvement over the best member, and out-of-fold meta predictions.
        source: R/ensemble-helpers.R#L604
      - step: Promotes to horizons_ensemble, then with compute_uq on refits the meta-learner per fold and calibrates CV+ intervals on signed residuals; UQ failure degrades to no bundle with a note, never to a failed ensemble.
        source: R/pipeline-ensemble.R#L194
      - step: Certifies the ensemble slot against its contract before returning.
        source: R/pipeline-ensemble.R#L212
    records:
      - field: ensemble$method, ensemble$model, ensemble$weights
        text: the meta-learner, its fitted form, and one weight per member
        source: R/pipeline-ensemble.R#L192
      - field: ensemble$predictions, ensemble$metrics, ensemble$member_metrics, ensemble$improvement
        text: the ensemble scored on Split F's test rows beside each member, and the gain over the best member on the rank metric, reported even when it is negative
        source: R/ensemble-helpers.R#L617
      - field: ensemble$uq
        text: the CV+ bundle, fold models plus calibration residuals, or NULL
        source: R/pipeline-ensemble.R#L203
    refuses:
      - when: the input is not a horizons_fit, or the method is unknown
        does: aborts
        source: R/pipeline-ensemble.R#L92
      - when: an observed value of the outcome lies outside configure()'s outcome_range or is infinite
        does: aborts at entry with class horizons_input_error, naming outcome_range and how to set it
        source: R/pipeline-ensemble.R#L104
      - when: the ensemble does not beat its best member
        does: reports the non-positive improvement in the summary rather than hiding it
        source: R/pipeline-ensemble.R#L277

  # ---------------------------------------------------------------------------
  - verb: predict.horizons_fit
    rd: predict.horizons_fit
    display: predict
    label: predict new spectra from a fit
    lanes: [local, library]
    order: 9
    class_in: horizons_fit
    class_out: predictions tibble
    summary: >-
      Predicts new spectra with the best fitted configuration, a named one, or
      all of them. New data must already be on the training wavenumber axis;
      the per-configuration recipe replays preprocessing and feature selection
      but not standardize(), and a schema gate refuses a mismatch. Returns point
      predictions on the original scale, clamped to the outcome range (floored
      at zero by default) and winsorized to the response bound, plus conformal
      intervals and applicability-domain columns
      where fit() built them. In library mode the AD signal to trust is the
      selection distance, and the residual correction is designed but not built.
    args:
      - name: object
        touch: Always; the horizons_fit.
        source: R/pipeline-predict.R#L134
      - name: new_data
        touch: Always; a horizons_data standardized to the same grid as the training data, or a data frame with the same wn_ columns and a sample_id.
        source: R/pipeline-predict.R#L460
      - name: config
        touch: A config_id to predict from a specific model, or "all" for one block per fitted model.
        source: R/pipeline-predict.R#L773
      - name: interval
        touch: FALSE for point predictions only; ignored where no UQ bundle exists.
        source: R/pipeline-predict.R#L918
      - name: abstain_ood
        touch: TRUE to return NA predictions for samples the applicability domain flags out-of-domain, keeping the distance and flag columns.
        source: R/pipeline-predict.R#L964
      - name: '...'
        touch: Unused.
        source: R/pipeline-predict.R#L128
    mechanics:
      - step: Resolves which configurations are being predicted, and from their rows which covariate columns they promoted to predictors, so those are kept from new_data and required.
        source: R/pipeline-predict.R#L160
      - step: Loads the namespaces predict() needs for the stored workflow and each config's model engine — workflows, parsnip and recipes unconditionally, plus the engine package(s) for every model actually being predicted (not every config the object stores), plus ranger when a UQ bundle is present — none of which library(horizons) alone pulls in; aborts naming the package and the model if a Suggested engine is not installed.
        source: R/pipeline-predict.R#L171
      - step: Resolves new_data to sample_id plus the predictor columns, synthesizing ids for a bare data frame, and checks the training-axis schema fit() stored; a missing column aborts with the columns named.
        source: R/pipeline-predict.R#L175
      - step: Warns once, when intervals will be produced, that conformal coverage does not transfer if the model was fit on a selected training set.
        source: R/pipeline-predict.R#L536
      - step: Per configuration, predicts on the transformed scale, back-transforms once and clamps to configure()'s outcome range (a floor at zero under the default and on objects configured before the range existed, nothing for c(-Inf, Inf)), then winsorizes .pred alone to the response bound, with a warning when anything is clamped.
        source: R/pipeline-predict.R#L869
      - step: With a UQ bundle and interval = TRUE, bakes the new data through the UQ recipe, predicts residual quantiles from the quantile forest, adds the signed conformal margin around the point before winsorizing, repairs crossing bounds and clamps them to the outcome range; every term is already on the original scale, so nothing is back-transformed twice. A bake or quantile-prediction failure warns and degrades to point predictions instead of disappearing silently.
        source: R/pipeline-predict.R#L1087
      - step: With an AD bundle, computes the squared Mahalanobis distance to the training centroid under the shrinkage covariance and bins it Q1 to Q4 or OOD against the held-out thresholds; abstains if asked.
        source: R/pipeline-predict.R#L949
    records:
      - field: sample_id, .pred
        text: one row per sample, plus config_id when config = "all"
        source: R/pipeline-predict.R#L903
      - field: .pred_lower, .pred_upper, .interval_width
        text: present when intervals were requested and available
        source: R/pipeline-predict.R#L1150
      - field: .ad_distance, .ad_flag
        text: present when the configuration has an AD bundle and the AD computation succeeded
        source: R/pipeline-predict.R#L956
    refuses:
      - when: the object is not a horizons_fit or has no workflows, config names an unfitted model, or new_data is neither a horizons_data nor a data frame
        does: aborts
        source: R/pipeline-predict.R#L134
      - when: new_data lacks a predictor column of the training axis, or a covariate a configuration uses
        does: aborts naming the missing columns and pointing at standardize()
        source: R/pipeline-predict.R#L668
      - when: a config being predicted needs an engine package (or ranger, for a UQ bundle) that is not installed
        does: aborts once, naming every missing package and the model(s) that need it
        source: R/pipeline-predict.R#L404
      - when: a prediction is clamped to the response bound, coverage cannot be guaranteed on a selected fit, or abstention was asked for with no AD information
        does: warns
        source: R/pipeline-predict.R#L990
      - when: interval computation fails for a configuration (a UQ bundle exists, but baking new_data or predicting quantiles errors)
        does: warns, naming the config and the failing step, and degrades to point predictions without interval columns
        source: R/pipeline-predict.R#L1105
      - when: AD computation fails for a configuration, in the bake or in the distance
        does: warns with class horizons_ad_warning, naming the configuration and giving the cause, and returns the predictions without the AD columns
        source: R/ad.R#L575
    design_ahead:
      - text: the on-library residual correction from the pool fit's out-of-fold errors, gated by the selection distance, is designed and unbuilt; where it lives (predict() reading the selection record, or a separate verb) is open
        source: ../dev/specs/v1-refactor/select-training-design.md#what-changed-on-2026-09-22-the-overnight-run-and-its-follow-up
    evidence:
      - claim: the correction is worth about 10 % RMSE on-library from a pool fit and costs 14 to 16 % off-library
        where: dev/experiments/2026-09-factorial/README.md#same-afternoon-2026-09-22-the-library-ships-whole-and-the-correction-from-the-pool-fit
        value: "Iowa cosine k 100: 3.140 → 2.827; MOYS: 0.348 → 0.403"

  # ---------------------------------------------------------------------------
  - verb: predict.horizons_ensemble
    rd: predict.horizons_ensemble
    display: predict
    label: predict new spectra from an ensemble
    lanes: [local, library]
    order: 10
    optional: true
    class_in: horizons_ensemble
    class_out: predictions
    summary: >-
      Predicts new spectra through every member and combines them with the
      meta-learner. Every member must predict, because the meta-learner is only
      valid over the exact set it trained on. Member predictions are combined
      without the response bound, the combination is clamped to the outcome
      range, and the response bound is applied once to the combined output.
      Intervals, when the ensemble carries a CV+ bundle, are aggregates over the
      fold models and can occasionally exclude the deployed point prediction;
      that is a property of CV+ and is not repaired.
    args:
      - name: object
        touch: Always; the horizons_ensemble.
        source: R/ensemble-helpers.R#L744
      - name: new_data
        touch: Always; on the training axis, as for predict() on a fit.
        source: R/ensemble-helpers.R#L804
      - name: interval
        touch: FALSE for point predictions only; only the ensemble's own CV+ bundle produces intervals, never the members'.
        source: R/ensemble-helpers.R#L873
      - name: '...'
        touch: Unused.
        source: R/ensemble-helpers.R#L738
    mechanics:
      - step: Reads the member set from the weights table, the members the meta-learner actually trained on, rather than re-deriving it.
        source: R/ensemble-helpers.R#L774
      - step: Loads the namespaces predict() needs, as predict.horizons_fit() does, scoped to the member set the meta-learner actually trained on rather than every config the underlying fit stored (gather_members() can drop a stored config that lacks out-of-fold predictions, so the two sets are not always the same).
        source: R/ensemble-helpers.R#L793
      - step: Resolves and schema-checks new_data as the fit method does, and warns once about conformal coverage on a selected training set.
        source: R/ensemble-helpers.R#L804
      - step: When the members were fit on a response-trimmed training partition (#77), warns once, class horizons_response_trim_warning, that the CV+ intervals were calibrated within the training fences, since the out-of-fold predictions they are built from cover only the rows inside them. The mechanism is a follow-up.
        source: R/pipeline-predict.R#L586
      - step: Every member predicts point-only, clamped to the outcome range but not winsorized, and without its applicability domain, so the features match the out-of-fold values the meta-learner trained on and no member AD is computed only to be dropped; duplicate sample ids abort.
        source: R/ensemble-helpers.R#L825
      - step: Combines by the method, a weighted sum or the fitted meta-model, clamps the combination to the outcome range, and applies the response bound once at the output.
        source: R/ensemble-helpers.R#L834
      - step: Joins CV+ interval bounds, clamped to the outcome range, by sample_id when a bundle exists and intervals were asked for; a corrupt or unusable bundle, a fold model that fails to predict, or a too-small calibration set warns and degrades to point predictions instead of disappearing silently.
        source: R/ensemble-uq.R#L732
    records:
      - field: sample_id, .pred
        text: one row per sample, the response bound applied once here
        source: R/ensemble-helpers.R#L859
      - field: .pred_lower, .pred_upper, .interval_width
        text: present when ensemble UQ exists and interval = TRUE
        source: R/ensemble-helpers.R#L900
    refuses:
      - when: a member's model needs an engine package that is not installed
        does: aborts once, naming every missing package and the model(s) that need it
        source: R/pipeline-predict.R#L404
      - when: the object is not a horizons_ensemble or carries no ensemble, a member fails to predict, or sample ids repeat
        does: aborts naming the member or the key
        source: R/ensemble-helpers.R#L744
      - when: the ensemble's CV+ interval bundle is unrecognized, a retained fold model fails to predict, or the calibration set is too small for the requested coverage level
        does: warns and degrades to point predictions without interval columns
        source: R/ensemble-uq.R#L732
