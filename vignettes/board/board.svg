<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 658" width="1590" height="658" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
<rect width="1590" height="658" fill="#f1f0ea"/>
<g class="lane lane-local"><rect x="20" y="164" width="1520" height="110" rx="10" fill="#d9bd9c" opacity="0.35"/>
<text x="34" y="190" fill="#b07d4e" font-weight="600" font-size="15">Local</text>
<text x="34" y="209" fill="#534b52" font-size="11">your own referenced samples</text>
<text x="34" y="224" fill="#534b52" font-size="11">train the model</text>
</g>
<g class="lane lane-library"><rect x="20" y="30" width="1520" height="110" rx="10" fill="#c3a6b8" opacity="0.35"/>
<text x="34" y="56" fill="#7d4f66" font-weight="600" font-size="15">Library</text>
<text x="34" y="75" fill="#534b52" font-size="11">a reference library is drawn</text>
<text x="34" y="90" fill="#534b52" font-size="11">around your batch</text>
</g>
<g class="lane lane-local"><rect x="20" y="478" width="1300" height="110" rx="10" fill="#d9bd9c" opacity="0.35"/>
<text x="34" y="504" fill="#b07d4e" font-weight="600" font-size="15">Local (continued)</text>
</g>
<g class="lane lane-library"><rect x="20" y="344" width="1300" height="110" rx="10" fill="#c3a6b8" opacity="0.35"/>
<text x="34" y="370" fill="#7d4f66" font-weight="600" font-size="15">Library (continued)</text>
</g>
<g class="node node-both" data-verb="spectra" style="cursor:pointer">
<rect x="250" y="38" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="262" y="140" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">spectra()</text>
<text x="262" y="156" fill="#534b52" font-size="11">read spectra into a</text>
<text x="262" y="172" fill="#534b52" font-size="11">horizons_data</text>
<text x="262" y="257" fill="#474448" font-size="10">path / data frame → horizons_data</text>
</g>
<g class="node node-both" data-verb="standardize" style="cursor:pointer">
<rect x="470" y="38" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="482" y="140" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">standardize()</text>
<text x="482" y="156" fill="#534b52" font-size="11">one grid, one range</text>
<text x="482" y="257" fill="#474448" font-size="10">horizons_data → horizons_data</text>
</g>
<g class="node node-both" data-verb="average" style="cursor:pointer">
<rect x="690" y="38" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="702" y="140" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">average()</text>
<text x="702" y="156" fill="#534b52" font-size="11">collapse replicate scans</text>
<text x="702" y="257" fill="#474448" font-size="10">horizons_data → horizons_data</text>
</g>
<g class="node node-local" data-verb="add_response" style="cursor:pointer">
<rect x="910" y="172" width="190" height="94" rx="8" fill="#ffffff" stroke="#b07d4e" stroke-width="1.5"/>
<text x="922" y="196" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">add_response()</text>
<text x="922" y="212" fill="#534b52" font-size="11">join lab values by sample</text>
<text x="922" y="228" fill="#534b52" font-size="11">id</text>
<text x="922" y="257" fill="#474448" font-size="10">horizons_data → horizons_data</text>
</g>
<g class="node node-library" data-verb="select_training" style="cursor:pointer">
<rect x="910" y="38" width="190" height="94" rx="8" fill="#ffffff" stroke="#7d4f66" stroke-width="1.5"/>
<text x="922" y="62" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">select_training()</text>
<text x="922" y="78" fill="#534b52" font-size="11">draw a training set around</text>
<text x="922" y="94" fill="#534b52" font-size="11">the batch</text>
<text x="922" y="123" fill="#474448" font-size="10">targets + library → horizons_data</text>
</g>
<g class="node node-both" data-verb="configure" style="cursor:pointer">
<rect x="1130" y="38" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="1142" y="140" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">configure()</text>
<text x="1142" y="156" fill="#534b52" font-size="11">name the outcome and the</text>
<text x="1142" y="172" fill="#534b52" font-size="11">grid</text>
<text x="1142" y="257" fill="#474448" font-size="10">horizons_data → horizons_data</text>
</g>
<g class="node node-both" data-verb="validate" style="cursor:pointer">
<rect x="1350" y="38" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="1362" y="140" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">validate()</text>
<text x="1362" y="156" fill="#534b52" font-size="11">pre-flight checks and</text>
<text x="1362" y="172" fill="#534b52" font-size="11">outliers</text>
<text x="1362" y="257" fill="#474448" font-size="10">horizons_data → horizons_data</text>
</g>
<g class="node node-both" data-verb="evaluate" style="cursor:pointer">
<rect x="250" y="352" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="262" y="454" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">evaluate()</text>
<text x="262" y="470" fill="#534b52" font-size="11">tune and rank every</text>
<text x="262" y="486" fill="#534b52" font-size="11">configuration</text>
<text x="262" y="571" fill="#474448" font-size="10">horizons_data → horizons_eval</text>
</g>
<g class="node node-both" data-verb="fit" style="cursor:pointer">
<rect x="470" y="352" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="482" y="454" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">fit()</text>
<text x="482" y="470" fill="#534b52" font-size="11">re-tune the best and fit</text>
<text x="482" y="486" fill="#534b52" font-size="11">them for deployment</text>
<text x="482" y="571" fill="#474448" font-size="10">horizons_eval → horizons_fit</text>
</g>
<g class="node node-both" data-verb="ensemble" style="cursor:pointer">
<rect x="690" y="352" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="702" y="454" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">ensemble()</text>
<text x="702" y="470" fill="#534b52" font-size="11">stack the fitted models</text>
<text x="702" y="571" fill="#474448" font-size="10">horizons_fit → horizons_ensemble</text>
</g>
<g class="node node-both" data-verb="predict.horizons_fit" style="cursor:pointer">
<rect x="910" y="352" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5"/>
<text x="922" y="454" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">predict()</text>
<text x="922" y="470" fill="#534b52" font-size="11">predict new spectra from a</text>
<text x="922" y="486" fill="#534b52" font-size="11">fit</text>
<text x="922" y="571" fill="#474448" font-size="10">horizons_fit → predictions tibble</text>
</g>
<g class="node node-both" data-verb="predict.horizons_ensemble" style="cursor:pointer">
<rect x="1130" y="352" width="190" height="228" rx="8" fill="#ffffff" stroke="#474448" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1142" y="454" fill="#2d232e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="13">predict()</text>
<text x="1142" y="470" fill="#534b52" font-size="11">predict new spectra from</text>
<text x="1142" y="486" fill="#534b52" font-size="11">an ensemble</text>
<text x="1142" y="571" fill="#474448" font-size="10">horizons_ensemble → predictions</text>
</g>
